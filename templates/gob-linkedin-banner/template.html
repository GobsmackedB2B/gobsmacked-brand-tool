<style>
  .frame {
    position: relative;
    width: 1584px;
    height: 396px;
    overflow: hidden;
    background: var(--color-achtergrond);
    color: var(--color-op-achtergrond);
    font-family: var(--font-tekst);
  }
  .kop {
    margin: 0;
    font-family: var(--font-kop);
    font-weight: var(--font-kop-weight);
    text-transform: uppercase;
    white-space: pre-line;
  }
  /* The highlighted line: letters outlined only, no fill (Gobsmacked typographic accent). */
  .outline {
    display: block;
    color: transparent;
    -webkit-text-stroke: 2px var(--color-op-achtergrond);
  }
  .label {
    margin: 0;
    font-family: var(--font-kop);
    font-weight: 600;
    font-size: 20px;
    line-height: 1.2;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-merk);
  }
  /* Locked: the blobs (see brand rules). A pair on opposite edges; both centres lie outside the
     frame and fade to transparent, the middle stays dark. The variant slot picks the positions. */
  .frame[data-blob="hoeken"] { --blob-p: 40% 95% at -6% 100%; --blob-a: 36% 90% at 106% 0%; }
  .frame[data-blob="gespiegeld"] { --blob-p: 40% 95% at 106% 100%; --blob-a: 36% 90% at -6% 0%; }
  .frame[data-blob="boven-onder"] { --blob-p: 85% 120% at 50% 150%; --blob-a: 75% 105% at 50% -45%; }
  .frame[data-blob="zijkanten"] { --blob-p: 32% 120% at -10% 50%; --blob-a: 28% 110% at 110% 50%; }
  .frame[data-blob="ingetogen"] { --blob-p: 28% 70% at -6% 105%; --blob-a: 24% 62% at 106% -5%; }
  .blobs {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(var(--blob-p), color-mix(in srgb, var(--color-gloed-links) 92%, transparent) 0%, transparent 70%),
      radial-gradient(var(--blob-a), color-mix(in srgb, var(--color-gloed-rechts) 58%, transparent) 0%, transparent 70%);
    pointer-events: none;
  }
  /* The left ~450px stays calm: LinkedIn puts the profile photo there. */
  .kop { position: absolute; left: 560px; top: 78px; font-size: 64px; line-height: 1; letter-spacing: -0.01em; }
  .kop > span, .kop { white-space: nowrap; }
  .logo { position: absolute; right: 80px; bottom: 64px; width: 230px; }
</style>
<div class="frame" data-slot="blob" data-slot-attr="data-blob" data-blob="hoeken">
  <div class="blobs"></div>
  <h1 class="kop">B2B marketing<span class="outline">engineered voor de</span>maakindustrie</h1>
  <img class="logo" data-slot="logo" alt="" />
</div>
